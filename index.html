<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتب الرصد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">

        <!-- Header / HUD -->
        <header id="hud">
            <button id="inventory-btn">المحفظة 💼</button>
        </header>

        <!-- Main Stage Area -->
        <main id="stage" class="bg-street">

            <!-- Character rendering -->
            <div id="character" class="char-idle">
                <div class="head"></div>
                <div class="body"></div>
                <div class="legs"></div>
            </div>

            <!-- Minigame Overlay (Hidden by default) -->
            <div id="minigame-container" class="hidden">
                <div class="door-target">🚪</div>
                <div id="camera-view">🎥</div>
                <div class="controls">
                    <button id="cam-left">◀</button>
                    <button id="cam-right">▶</button>
                </div>
                <button id="cam-confirm" class="hidden">تأكيد التركيب</button>
            </div>

        </main>

        <!-- Dialogue / UI Overlay -->
        <footer id="dialogue-box">
            <div id="text-container"></div>
            <button id="next-btn" class="hidden">التالي ➔</button>
            <div id="choices-container" class="hidden"></div>
        </footer>

        <!-- Inventory Modal -->
        <div id="inventory-modal" class="hidden modal">
            <div class="modal-content">
                <h2>المحفظة</h2>
                <p id="money-display">المال: 0 جنيه</p>
                <button id="close-inventory-btn">إغلاق</button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="story.js"></script>
    <script src="engine.js"></script>
</body>
</html>
